apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: warranty-claim-tracker
  namespace: warranty-claim-tracker
spec:
  ingressClassName: nginx
  rules:
  - host: ""
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: warranty-claim-tracker
            port:
              number: 80
