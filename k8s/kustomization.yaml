apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: warranty-claim-tracker

# The Secret is intentionally not listed — create it once by hand
# (see secret.example.yaml). db-push-job.yaml is also applied manually.
resources:
- namespace.yaml
- configmap.yaml
- postgres.yaml
- deployment.yaml
- pdb.yaml
- service.yaml
- ingress.yaml

labels:
- includeSelectors: false
  pairs:
    managed-by: kustomize
