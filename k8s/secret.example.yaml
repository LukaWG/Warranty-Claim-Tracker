# EXAMPLE ONLY — do not commit real values.
#
# Copy to secret.yaml (gitignored) and fill in real values, or create the
# secret directly:
#
#   kubectl create secret generic warranty-claim-tracker-secrets \
#     -n warranty-claim-tracker \
#     --from-literal=postgres-password='<strong-password>' \
#     --from-literal=auth-database-url='postgresql://adminuser:<strong-password>@postgres:5432/warranty_claim_tracker' \
#     --from-literal=better-auth-secret='<output of `openssl rand -base64 32`>' \
#     --from-literal=microsoft-client-id='' \
#     --from-literal=microsoft-client-secret='' \
#     --from-literal=microsoft-tenant-id='common'
#
apiVersion: v1
kind: Secret
metadata:
  name: warranty-claim-tracker-secrets
  namespace: warranty-claim-tracker
type: Opaque
stringData:
  postgres-password: "CHANGE-ME"
  # Must use the same password as postgres-password. Host `postgres` is the
  # in-cluster service from postgres.yaml.
  auth-database-url: "postgresql://adminuser:CHANGE-ME@postgres:5432/warranty_claim_tracker"
  # Generate with: openssl rand -base64 32
  better-auth-secret: "CHANGE-ME"
  microsoft-client-id: ""
  microsoft-client-secret: ""
  microsoft-tenant-id: "common"
