# Non-sensitive runtime configuration.
# NOTE: NEXT_PUBLIC_* values are NOT here — they are baked into the image at
# build time (see Dockerfile build args). Changing them requires a rebuild.
apiVersion: v1
kind: ConfigMap
metadata:
  name: warranty-claim-tracker-config
  namespace: warranty-claim-tracker
data:
  # Public URL users reach the app on (scheme + host). Better Auth uses this
  # for cookies/redirects; it must match the ingress host.
  better-auth-url: "http://192.168.1.144"
  # Server-only: the warranty data API's URL. The browser never sees this —
  # only the app's own /api/data proxy calls it.
  data-api-url: "http://192.168.1.144:5001"
