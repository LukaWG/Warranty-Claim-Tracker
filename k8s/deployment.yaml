apiVersion: apps/v1
kind: Deployment
metadata:
  name: warranty-claim-tracker
  namespace: warranty-claim-tracker
  labels:
    app: warranty-claim-tracker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: warranty-claim-tracker
  template:
    metadata:
      labels:
        app: warranty-claim-tracker
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: warranty-claim-tracker
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        # Deploys pin a specific version live via:
        #   kubectl set image deployment/warranty-claim-tracker warranty-claim-tracker=lukawg/warranty-claim-tracker@<digest-or-sha> -n warranty-claim-tracker
        # That only patches the running Deployment — it does NOT update this
        # file. Re-running `kubectl apply -k k8s/` (e.g. after a ConfigMap/
        # Secret change) resets the image back to whatever's written here,
        # silently undoing the pinned version. Bump this line to match
        # whenever you `set image`, or re-apply it right after.
        image: lukawg/warranty-claim-tracker:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: HOSTNAME
          value: "0.0.0.0"
        - name: BETTER_AUTH_URL
          valueFrom:
            configMapKeyRef:
              name: warranty-claim-tracker-config
              key: better-auth-url
        - name: AUTH_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: warranty-claim-tracker-secrets
              key: auth-database-url
        - name: BETTER_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: warranty-claim-tracker-secrets
              key: better-auth-secret
        - name: MICROSOFT_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: warranty-claim-tracker-secrets
              key: microsoft-client-id
              optional: true
        - name: MICROSOFT_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: warranty-claim-tracker-secrets
              key: microsoft-client-secret
              optional: true
        - name: MICROSOFT_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: warranty-claim-tracker-secrets
              key: microsoft-tenant-id
              optional: true
        - name: DATA_API_URL
          valueFrom:
            configMapKeyRef:
              name: warranty-claim-tracker-config
              key: data-api-url
        - name: DATA_API_KEY
          valueFrom:
            secretKeyRef:
              name: warranty-claim-tracker-secrets
              key: data-api-key
        livenessProbe:
          httpGet:
            path: /login
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /login
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
