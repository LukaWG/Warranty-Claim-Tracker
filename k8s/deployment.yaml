apiVersion: apps/v1
kind: Deployment
metadata:
  name: warranty-claim-tracker
  namespace: warranty-claim-tracker
  labels:
    app: warranty-claim-tracker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: warranty-claim-tracker
  template:
    metadata:
      labels:
        app: warranty-claim-tracker
    spec:
      containers:
      - name: warranty-claim-tracker
        image: warranty-claim-tracker:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: NEXT_PUBLIC_BASE_PATH
          valueFrom:
            configMapKeyRef:
              name: warranty-claim-tracker-config
              key: base-path
        livenessProbe:
          httpGet:
            path: /Warranty-Claim-Tracker
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /Warranty-Claim-Tracker
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
