# Builds and pushes the Docker image on every push to main.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#
# Optional repository variables (Settings -> Secrets and variables -> Actions
# -> Variables). These are baked into the client bundle at build time:
#   NEXT_PUBLIC_API_URL, NEXT_PUBLIC_APP_URL, NEXT_PUBLIC_BASE_PATH,
#   NEXT_PUBLIC_ENABLE_MICROSOFT_SSO, NEXT_PUBLIC_AUTO_LOGIN_MICROSOFT_SSO
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            lukawg/warranty-repair-tracker:latest
            lukawg/warranty-repair-tracker:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://192.168.1.144:5001' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'http://192.168.1.144' }}
