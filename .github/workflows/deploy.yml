# Builds and pushes a multi-arch (amd64+arm64) Docker image on every push to main.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#
# Optional repository variables (Settings -> Secrets and variables -> Actions
# -> Variables). These are baked into the client bundle at build time:
#   NEXT_PUBLIC_APP_URL, NEXT_PUBLIC_BASE_PATH,
#   NEXT_PUBLIC_ENABLE_MICROSOFT_SSO, NEXT_PUBLIC_AUTO_LOGIN_MICROSOFT_SSO
#
# DATA_API_URL / DATA_API_KEY are runtime-only (see Dockerfile) and are set
# where the container actually runs (compose .env / k8s Secret), not here.
name: Deploy to Docker
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            lukawg/warranty-claim-tracker:latest
            lukawg/warranty-claim-tracker:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'http://192.168.1.144' }}
            NEXT_PUBLIC_ENABLE_MICROSOFT_SSO=${{ vars.NEXT_PUBLIC_ENABLE_MICROSOFT_SSO || 'false' }}
            NEXT_PUBLIC_AUTO_LOGIN_MICROSOFT_SSO=${{ vars.NEXT_PUBLIC_AUTO_LOGIN_MICROSOFT_SSO || 'false' }}
            AUTH_DATABASE_URL=${{ secrets.AUTH_DATABASE_URL || '' }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET || '' }}