# Single-host Docker deployment: Postgres + the Next.js app.
#
# First run:   docker compose up -d --build
# Create the auth tables (once, and after any schema change):
#              docker compose --profile setup run --rm db-push
# Update:      docker compose up -d --build   (or pull a new image, see below)
#
# Secrets/urls are interpolated from the .env file in this directory.

services:
  db:
    image: postgres:16
    container_name: warranty-claim-tracker-db
    environment:
      POSTGRES_USER: adminuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Password}
      POSTGRES_DB: warranty_claim_tracker
    ports:
      - "51214:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adminuser -d warranty_claim_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        # Baked into the client bundle at build time — rebuild to change.
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001}
        NEXT_PUBLIC_API_TIMEOUT: ${NEXT_PUBLIC_API_TIMEOUT:-30000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_ENABLE_MICROSOFT_SSO: ${NEXT_PUBLIC_ENABLE_MICROSOFT_SSO:-false}
        NEXT_PUBLIC_AUTO_LOGIN_MICROSOFT_SSO: ${NEXT_PUBLIC_AUTO_LOGIN_MICROSOFT_SSO:-false}
    image: lukawg/warranty-claim-tracker:latest
    container_name: warranty-claim-tracker-app
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      AUTH_DATABASE_URL: postgresql://adminuser:${POSTGRES_PASSWORD:-Password}@db:5432/warranty_claim_tracker
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
    restart: unless-stopped

  # One-shot helper that creates/updates the Better Auth tables in Postgres.
  # Run with: docker compose --profile setup run --rm db-push
  db-push:
    profiles: ["setup"]
    image: lukawg/warranty-claim-tracker:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      AUTH_DATABASE_URL: postgresql://adminuser:${POSTGRES_PASSWORD:-Password}@db:5432/warranty_claim_tracker
    command: ["npx", "prisma", "db", "push"]

  # Optional: auto-pull and restart the app when a new image is pushed to the
  # registry. Uncomment to enable hands-off updates on this host.
  # watchtower:
  #   image: containrrr/watchtower
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   environment:
  #     - WATCHTOWER_POLL_INTERVAL=30
  #   restart: unless-stopped

volumes:
  postgres_data:
