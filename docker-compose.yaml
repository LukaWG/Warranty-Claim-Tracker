# Single-host Docker deployment: Postgres + the Next.js app.
#
# First run:   docker compose up -d
#              (the app container runs `prisma db push` itself on every
#              start, before launching the server — see app's command below)
# Update:      docker compose pull && docker compose up -d
#
# Secrets/urls are interpolated from the .env file in this directory.

services:
  auth:
    image: postgres:16
    container_name: auth
    # Defaults to "Password" (matching the app image's baked-in
    # AUTH_DATABASE_URL — see Dockerfile) so this works with no .env entry.
    # If you override BETTER_AUTHPW in .env, the app image must be
    # rebuilt with a matching --build-arg AUTH_DATABASE_URL or it won't be
    # able to connect — the two are not linked automatically.
    environment:
      POSTGRES_USER: adminuser
      POSTGRES_PASSWORD: ${BETTER_AUTHPW:-Password}
      POSTGRES_DB: warranty_claim_tracker
    ports:
      - "51214:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adminuser -d warranty_claim_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    # Pulled from Docker Hub — NEXT_PUBLIC_* values were baked in at build
    # time when this image was built/pushed (see Dockerfile). To change them,
    # rebuild and push a new image rather than editing this file.
    image: lukawg/warranty-claim-tracker:latest
    container_name: warranty-claim-tracker-app
    # Reconciles the Better Auth tables against prisma/schema.prisma on every
    # start, then hands off to the standalone server. Runs in the app's own
    # container instead of a separate one-shot service — nothing extra to
    # see in `docker ps` / Docker Desktop, and nothing left over to clean up.
    command: ["sh", "-c", "npx prisma db push && node server.js"]
    depends_on:
      auth:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # AUTH_DATABASE_URL is intentionally NOT set here — the app image
      # already has it baked in at build time (see Dockerfile), matching the
      # auth service's credentials above. Setting it here would just override
      # that with the same value; omitted so this works with no .env entry.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://localhost}
      DATA_API_URL: ${DATA_API_URL:-http://localhost:5001}
      DATA_API_KEY: ${DATA_API_KEY:?set DATA_API_KEY in .env}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
    restart: unless-stopped

  # Terminates HTTPS with a self-signed cert and forwards to the app over the
  # internal network — the app itself is never exposed to the host directly.
  # The cert is generated on first boot into the proxy_certs volume (not
  # baked into the image, since this image gets built locally, never
  # published) so it persists across restarts and its hostnames can be
  # changed via SSL_CERT_HOSTS without a rebuild.
  proxy:
    build: ./nginx
    container_name: warranty-claim-tracker-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - proxy_certs:/etc/nginx/certs
    environment:
      SSL_CERT_HOSTS: ${SSL_CERT_HOSTS:-localhost,127.0.0.1,192.168.1.144,lukas-mbp.local}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  proxy_certs:
