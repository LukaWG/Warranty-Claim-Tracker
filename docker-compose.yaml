services:
  db:
    image: postgres:16
    container_name: warranty-claim-tracker-db
    environment:
      POSTGRES_USER: adminuser
      POSTGRES_PASSWORD: Password
      POSTGRES_DB: warranty_claim_tracker
    ports:
      - "51214:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nextapp:
    image: lukawg/warranty-repair-tracker:latest
    ports:
      - "3000:3000"
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=30
    restart: unless-stopped

volumes:
  postgres_data: