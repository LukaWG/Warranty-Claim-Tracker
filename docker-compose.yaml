# Docker Compose deployment: Postgres + the Next.js app image from Docker Hub.
# First run / after a new image is pushed:  docker compose pull && docker compose up -d
# Secrets/urls come from .env in this directory — see .env.deploy.example.

services:
  auth:
    image: postgres:16
    container_name: auth
    environment:
      POSTGRES_USER: adminuser
      POSTGRES_PASSWORD: ${BETTER_AUTHPW:-Password}
      POSTGRES_DB: warranty_claim_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adminuser -d warranty_claim_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    image: lukawg/warranty-claim-tracker:latest
    container_name: warranty-claim-tracker-app
    # Reconciles the Better Auth tables, then starts the server.
    command: ["sh", "-c", "npx prisma db push && node server.js"]
    ports:
      - "80:3000"
    depends_on:
      auth:
        condition: service_healthy
    environment:
      NODE_ENV: production
      AUTH_DATABASE_URL: postgresql://adminuser:${BETTER_AUTHPW:-Password}@auth:5432/warranty_claim_tracker
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      DATA_API_URL: ${DATA_API_URL:-http://localhost:5001}
      DATA_API_KEY: ${DATA_API_KEY:?set DATA_API_KEY in .env}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
    restart: unless-stopped

volumes:
  postgres_data:
